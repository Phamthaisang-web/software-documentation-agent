standards:
  - standard_id: STD-SCRUM-2020
    official_name: "The Scrum Guide: The Definitive Guide to Scrum: The Rules of the Game"
    issuing_organization: "Ken Schwaber and Jeff Sutherland / Scrum.org & Scrum Inc."
    source_type: FRAMEWORK_GUIDE
    url: "https://scrumguides.org/scrum-guide.html"
    download_url: "https://scrumguides.org/download.html"
    vietnamese_url: "https://scrumguides.org/docs/scrumguide/v2020/2020-Scrum-Guide-Vietnamese.pdf"
    version: "November 2020"
    last_verified: "2026-10-29"
    verification_status: VERIFIED_OFFICIAL
    license: "Creative Commons Attribution-ShareAlike (CC BY-SA 4.0)"
    scope: "Scrum framework definition, roles/accountabilities, events, and artifacts"
    verified_clauses:
      - clause: "Sprint Timebox"
        content: "Sprints are fixed length events of one month or less to create consistency. A new Sprint starts immediately after the conclusion of the previous Sprint."
      - clause: "Sprint Planning Timebox"
        content: "Sprint Planning is timeboxed to a maximum of eight hours for a one-month Sprint. For shorter Sprints, the event is usually shorter."
      - clause: "Daily Scrum Timebox"
        content: "The Daily Scrum is a 15-minute event for the Developers of the Scrum Team."
      - clause: "Sprint Review Timebox"
        content: "The Sprint Review is timeboxed to a maximum of four hours for a one-month Sprint. For shorter Sprints, the event is usually shorter."
      - clause: "Sprint Retrospective Timebox"
        content: "The Sprint Retrospective is timeboxed to a maximum of three hours for a one-month Sprint. For shorter Sprints, the event is usually shorter."
      - clause: "Scrum Artifacts and Commitments"
        content: "Product Backlog (Commitment: Product Goal), Sprint Backlog (Commitment: Sprint Goal), Increment (Commitment: Definition of Done)."
      - clause: "Non-mandatory practices"
        content: "Story points, velocity, burndown charts, Definition of Ready, and Daily Scrum logs are optional complementary practices, not mandatory Scrum rules."
    access_limits: "Full text publicly accessible under CC BY-SA."

