    last_verified: "2026-10-29"
    verification_status: VERIFIED_OFFICIAL
    license: "ISO Copyright Protected"
    scope: "Processes and products involved in requirements engineering throughout software and systems life cycle"
    verified_clauses:
      - clause: "Scope & Requirements Properties"
        content: "Defines necessary attributes of requirements: necessary, unambiguous, consistent, complete, singular, feasible, verifiable, and traceable."
      - clause: "Information Item Content"
        content: "Provides information item descriptions for Stakeholder Requirements Specification, System Requirements Specification, and Software Requirements Specification (SRS)."
